<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyeux Anniversaire</title>

<style>
body{
    margin:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(#001,#000428);
    perspective:1000px;
    font-family:Arial,sans-serif;
}

.rocket{
    position:absolute;
    bottom:-120px;
    font-size:90px;
    animation:launch 5s ease-in-out forwards;
    transform-style:preserve-3d;
}

@keyframes launch{
    0%{
        transform:translateY(0) rotateY(0deg) scale(1);
    }
    40%{
        transform:translateY(-250px) rotateY(180deg) scale(1.2);
    }
    70%{
        transform:translateY(-550px) rotateY(360deg) scale(1.4);
    }
    100%{
        transform:translateY(-900px) scale(1.6);
    }
}

.message{
    opacity:0;
    color:white;
    font-size:45px;
    text-align:center;
    transform:scale(0.5);
    animation:showText 2s forwards;
    animation-delay:4.5s;
}

@keyframes showText{
    from{
        opacity:0;
        transform:scale(0.5) rotateX(90deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotateX(0deg);
    }
}
</style>

</head>
<body>

<div class="rocket"> ❤️❤️</div>

<div class="message">
 je t'aime 
</div>

</body>
</html>
